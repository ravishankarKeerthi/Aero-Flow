let current='home',selected=null,subtab='Details',filterStatus='All',searchText='',viewMode='List',toastTimer;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('txOdooDemo',JSON.stringify(data))}catch(e){}}try{const saved=localStorage.getItem('txOdooDemo');if(saved)data=JSON.parse(saved)}catch(e){}
function notify(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2500)}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){ $('toplinks').innerHTML=modules.filter(m=>m[0]!=='home').map(m=>`<button class="${current===m[0]?'active':''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('')}
function go(m){current=m;selected=null;subtab='Details';searchText='';filterStatus='All';viewMode=m==='queues'?'Kanban':'List';render()}function openRecord(m,id){if(m==='queues')m='services';current=m;selected=id;subtab='Details';render()}function getRows(m){return data[m]||[]}function title(m){return (modules.find(x=>x[0]===m)||[])[1]||m}function icon(m){return (modules.find(x=>x[0]===m)||[])[2]||'▦'}function count(m){return (data[m]||[]).length}
function render(){nav();$('crumb').innerHTML=`Apps / <b>${escapeHtml(title(current))}</b>${selected?' / '+escapeHtml(selected):''}`;if(current==='home')renderHome();else if(current==='settings')renderSettings();else if(selected)renderForm();else renderList()}
function renderHome(){const cards=[['bookings','Online Bookings','Create and confirm passenger service bookings.',count('bookings')+' bookings'],['flights','Flights','Maintain flight schedule and terminal details.',count('flights')+' flights'],['services','Service Requests','Assign and track airport service fulfilment.',count('services')+' requests'],['queues','Queue Management','Automated service dispatch and waiting list.',count('services')+' active requests'],['resources','Resources','Counters, teams, equipment and availability.',count('resources')+' resources'],['customers','Customers & Airlines','Passenger and airline contact records.',count('customers')+' contacts'],['invoices','Invoicing','Create invoices from completed services.',count('invoices')+' invoices'],['settings','Configuration','Service catalogue, prices and queue settings.','3 service types']];$('app').innerHTML=`<div class="pagehead"><div class="titleline"><div class="appicon">▦</div><div><h1>AeroFlow 360</h1><div class="subtext">Airport authority workspace for passenger bookings, flight-linked services, queues, resources and billing.</div></div></div><div class="actions"><button class="btn primary" onclick="createRecord('bookings')">＋ New Booking</button><button class="btn" onclick="createRecord('services')">＋ Service Request</button></div></div><div class="homegrid">${cards.map(c=>`<div class="appcard" onclick="go('${c[0]}')"><div class="appico">${icon(c[0])}</div><h3>${c[1]}</h3><p>${c[2]}</p><div class="appcount">${c[3]}　→</div></div>`).join('')}</div><div class="notice"><b>Daily workflow:</b> Online Booking → Flight link → Service Request → Queue & Resource Assignment → Service Completion → Invoice. Click any app to work with records.</div><div class="subtable"><h3>My Activities</h3>${tableFor('services',data.services.slice(0,3),true)}</div>`}
const config={bookings:{name:'Booking',icon:'▣',singular:'Booking',cols:[['id','Booking Reference'],['customer','Passenger / Customer'],['flight','Flight'],['travelDate','Travel Date'],['service','Service'],['source','Source'],['status','Status']]},flights:{name:'Flight',icon:'✈',singular:'Flight',cols:[['id','Flight'],['airline','Airline'],['origin','Origin'],['destination','Destination'],['date','Date'],['time','Departure'],['status','Status']]},services:{name:'Service Request',icon:'◉',singular:'Service Request',cols:[['id','Reference'],['booking','Booking'],['customer','Customer'],['flight','Flight'],['service','Service Type'],['assigned','Assigned To'],['status','Status']]},queues:{name:'Queue Item',icon:'☷',singular:'Queue Item',cols:[['id','Reference'],['customer','Customer'],['service','Service'],['flight','Flight'],['priority','Priority'],['resource','Resource'],['status','Status']]},resources:{name:'Resource',icon:'⚙',singular:'Resource',cols:[['id','Code'],['name','Name'],['type','Type'],['location','Location'],['team','Team'],['status','Status']]},customers:{name:'Contact',icon:'♙',singular:'Contact',cols:[['id','Reference'],['name','Name'],['type','Type'],['phone','Phone'],['email','Email'],['terms','Payment Terms']]},invoices:{name:'Invoice',icon:'＄',singular:'Invoice',cols:[['id','Invoice'],['customer','Customer'],['booking','Booking'],['date','Invoice Date'],['amount','Total'],['status','Status'],['payment','Payment Status']]}};
function badge(v){let cl=['Confirmed','Posted','Paid','Completed','Available'].includes(v)?'green':['Waiting List','New','Draft','Assigned','Scheduled'].includes(v)?'blue':['Delayed','In Progress','In Use','High'].includes(v)?'orange':['Cancelled','Overdue'].includes(v)?'red':'purple';return `<span class="badge ${cl}">${escapeHtml(v||'—')}</span>`}
function tableFor(m,rows,compact=false){const cfg=config[m];if(!cfg)return '';return `<div class="tablebox"><table><thead><tr>${cfg.cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr onclick="openRecord('${m}','${escapeHtml(r.id)}')">${cfg.cols.map((c,i)=>`<td>${i===0?`<span class="record">${escapeHtml(r[c[0]])}</span>`:c[0]==='status'||c[0]==='payment'?badge(r[c[0]]):c[0]==='amount'?`₹${Number(r[c[0]]||0).toLocaleString('en-IN')}`:escapeHtml(r[c[0]]||'—')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cfg.cols.length}" class="empty">No records found.</td></tr>`}</tbody></table></div>`}
function renderList(){const cfg=config[current];let rows=getRows(current);if(current==='queues')rows=data.services.map(s=>({...s,priority:s.priority||'Normal'}));const statuses=['All',...new Set(rows.map(r=>r.status).filter(Boolean))];const filtered=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(searchText.toLowerCase())&&(filterStatus==='All'||r.status===filterStatus));const smarts=smartButtons(current);$('app').innerHTML=`<div class="pagehead"><div class="titleline"><div class="appicon">${cfg.icon}</div><div><h1>${cfg.name}s</h1><div class="subtext">Manage ${cfg.name.toLowerCase()} records and related operational activity.</div></div></div><div class="actions"><button class="btn" onclick="exportCsv('${current}')">⇩ Export</button><button class="btn primary" onclick="createRecord('${current==='queues'?'services':current}')">＋ New ${cfg.singular}</button></div></div>${smarts?`<div class="smartrow">${smarts}</div>`:''}<div class="listtools"><div style="display:flex;gap:7px;flex-wrap:wrap"><input class="search" placeholder="Search records…" value="${escapeHtml(searchText)}" oninput="searchText=this.value;renderListOnly()"><select class="filter" onchange="filterStatus=this.value;renderListOnly()">${statuses.map(s=>`<option ${filterStatus===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div><div style="display:flex;gap:6px"><button class="btn ${viewMode==='List'?'primary':''}" onclick="viewMode='List';renderList()">☷ List</button>${current==='queues'?`<button class="btn ${viewMode==='Kanban'?'primary':''}" onclick="viewMode='Kanban';renderList()">▦ Kanban</button>`:''}</div></div><div id="listcontent">${current==='queues'&&viewMode==='Kanban'?kanban(filtered):tableFor(current,filtered)}</div><div class="footerline"><span>${filtered.length} record(s)</span><span>Click a row to open the form view.</span></div>`}
function renderListOnly(){let rows=current==='queues'?data.services.map(s=>({...s,priority:s.priority||'Normal'})):getRows(current);let f=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(searchText.toLowerCase())&&(filterStatus==='All'||r.status===filterStatus));$('listcontent').innerHTML=current==='queues'&&viewMode==='Kanban'?kanban(f):tableFor(current,f);const foot=document.querySelector('.footerline');if(foot)foot.firstElementChild.textContent=f.length+' record(s)'}
function kanban(rows){const stages=['New','Assigned','In Progress','Completed'];return `<div class="kanban">${stages.map(st=>{const arr=rows.filter(r=>r.status===st);return `<div class="column"><div class="colhead"><span>${st}</span><span>${arr.length}</span></div>${arr.map(r=>`<div class="ticket" onclick="openRecord('services','${escapeHtml(r.id)}')"><strong>${escapeHtml(r.id)} · ${escapeHtml(r.service)}</strong><p>${escapeHtml(r.customer)} · ${escapeHtml(r.flight)}</p><p>${escapeHtml(r.slot||'No slot')} · ${escapeHtml(r.assigned||'Unassigned')}</p><div class="ticketfoot">${badge(r.priority||'Normal')}<span class="avatarmini">${escapeHtml((r.assigned||'?').slice(0,1))}</span></div></div>`).join('')||'<div class="tiny" style="padding:10px">No items</div>'}</div>`}).join('')}</div>`}
function smartButtons(m,r){
 if(!r)return '';

 else if(what==='Service Requests'||what==='Queue Items'){target='services';query=m==='bookings'?id:m==='flights'?id:m==='customers'?r?.name:m==='resources'?(r?.id||''):m==='services'?(r?.booking||id):id}

function closeModal(){$('modalback').classList.remove('show')}function submitCreate(m){let obj={};document.querySelectorAll('[data-new]').forEach(el=>obj[el.dataset.new]=el.value.trim());const seq=(data[m]||[]).length+1;const prefix={bookings:'BK/2026/',services:'SR/2026/',invoices:'INV/2026/',customers:'CUST/',resources:'R-',flights:''}[m]??'';if(m==='flights'){obj.id=obj.id||'NEW '+seq}else if(m==='resources'){obj.id=obj.id||'R-'+String(seq).padStart(2,'0')}else if(m==='customers'){obj.id='CUST/'+String(seq+12).padStart(4,'0')}else obj.id=prefix+String(seq+(m==='bookings'?48:m==='services'?108:m==='invoices'?18:0)).padStart(4,'0');if(m==='bookings'){obj.status='Confirmed';obj.source=obj.source||'Online Portal';obj.pax=obj.pax||'1';obj.queue='';obj.invoice='';if(!obj.customer||!obj.flight||!obj.service){notify('Enter passenger, flight and service before saving');return}let cap=capacityFor(obj.service);let used=data.bookings.filter(b=>b.service===obj.service&&b.travelDate===(obj.travelDate||'2026-10-12')&&b.status==='Confirmed').length;if(used>=cap){obj.status='Waiting List';notify('Capacity reached — booking added to waiting list')}else notify('Booking created and capacity reserved');}if(m==='services'){let b=data.bookings.find(x=>x.id===obj.booking);obj.customer=obj.customer||(b?.customer||'');obj.flight=obj.flight||(b?.flight||'');obj.priority=obj.priority||'Normal';obj.assigned='Unassigned';obj.resource='';obj.status='New';obj.slot=obj.slot||'16:30';if(b)b.queue=obj.id;notify('Service request created in queue')}if(m==='invoices'){obj.date=obj.date||'2026-10-12';obj.amount=Number(obj.amount||850);obj.status='Draft';obj.payment='Not Paid';notify('Draft invoice created')}if(m==='resources'){obj.capacity=obj.capacity||'1';obj.status='Available';obj.team=obj.team||'Operations';notify('Resource created')}if(m==='customers'){obj.type=obj.type||'Individual';obj.terms=obj.terms||'Immediate';notify('Contact created')}if(m==='flights'){obj.bookings=0;obj.status='Scheduled' function duplicateRecord(m,id){let r=getRows(m).find(x=>x.id===id);if(!r)return;createRecord(m);setTimeout(()=>{Object.entries(r).forEach(([k,v])=>{let el=document.querySelector(`[data-new="${k}"]`);if(el&&k!=='id')el.value=v})},50)}function renderSettings(){let rows=data.settings;$('app').innerHTML=`<div class="pagehead"><div class="titleline"><div class="appicon">☷</div><div><h1>Configuration</h1><div class="subtext">Maintain service catalogue, capacity and standard charges.</div></div></div><div class="actions"><button class="btn primary" onclick="createServiceType()">＋ New Service Type</button></div></div><div class="tabs"><button class="active">Service Catalogue</button><button onclick="notify('Queue automation settings: enabled for capacity-aware dispatch')">Queue Automation</button><button onclick="notify('Online booking integration is simulated in this prototype')">Online Booking</button></div><div class="sheet"><div class="notice">Queue rule: if available capacity is exhausted, place the booking on a waiting list. Resource assignment only uses resources marked Available.</div><div class="tablebox"><table><thead><tr><th>Service Type</th><th>Category</th><th>Standard Fee</th><th>Daily Capacity</th><th>Enabled</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="record">${escapeHtml(r.id)}</span></td><td>${escapeHtml(r.type)}</td><td>₹${Number(r.fee).toLocaleString('en-IN')}</td><td>${r.capacity}</td><td>${badge(r.enabled)}</td><td><button class="btn small" onclick="editServiceType(${i})">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function createServiceType(){ $('modalTitle').textContent='New Service Type';$('modalBody').innerHTML=`<div class="formlayout"><div class="group">${[['id','Service Name','text'],['fee','Standard Fee (₹)','number']].map(([k,l,t])=>`<div class="field"><label>${l}</label><input data-new="${k}" type="${t}"></div>`).join('')}</div><div class="group">${[['capacity','Daily Capacity','number']].map(([k,l,t])=>`<div class="field"><label>${l}</label><input data-new="${k}" type="${t}" value="5"></div>`).join('')}<div class="field"><label>Enabled</label><select data-new="enabled"><option>Yes</option><option>No</option></select></div></div></div>`;$('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">Discard</button><button class="btn primary" onclick="saveServiceType()">Save</button>`;$('modalback').classList.add('show')}
function saveServiceType(){let o={};document.querySelectorAll('[data-new]').forEach(e=>o[e.dataset.new]=e.value);if(!o.id){notify('Service name is required');return}o.fee=Number(o.fee||0);o.capacity=Number(o.capacity||1);data.settings.push(o);save();closeModal();renderSettings();notify('Service type saved')}
function editServiceType(i){let r=data.settings[i];$('modalTitle').textContent='Edit Service Type';$('modalBody').innerHTML=`<div class="formlayout"><div class="group"><div class="field"><label>Service Name</label><input id="stname" value="${escapeHtml(r.id)}"></div><div class="field"><label>Standard Fee (₹)</label><input id="stfee" type="number" value="${r.fee}"></div></div><div class="group"><div class="field"><label>Daily Capacity</label><input id="stcap" type="number" value="${r.capacity}"></div><div class="field"><label>Enabled</label><select id="sten"><option ${r.enabled==='Yes'?'selected':''}>Yes</option><option ${r.enabled==='No'?'selected':''}>No</option></select></div></div></div>`;$('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">Discard</button><button class="btn primary" onclick="data.settings[${i}]={...data.settings[${i}],id:$('stname').value,fee:Number($('stfee').value),capacity:Number($('stcap').value),enabled:$('sten').value};save();closeModal();renderSettings();notify('Service type updated')">Save</button>`;$('modalback').classList.add('show')}
function exportCsv(m){let rows=m==='queues'?data.services:getRows(m);let keys=Object.keys(rows[0]||{});let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='aeroflow360_'+m+'.csv';a.click();URL.revokeObjectURL(a.href);notify('CSV export prepared')}
render();
</script></body></html>
